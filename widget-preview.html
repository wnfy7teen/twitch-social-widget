<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitch Social Media Widget - Preview</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              insta: {
                start: '#f09433',
                end: '#c13584',
              },
              telegram: {
                blue: '#0088cc',
              },
            },
            shadows: {
              'neon-pink': '0 0 30px rgba(255, 105, 180, 0.8)',
              'neon-purple': '0 0 30px rgba(192, 132, 252, 0.7)',
              'neon-blue': '0 0 30px rgba(0, 136, 204, 0.7)',
            },
          },
        },
      };
    </script>

    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Framer Motion (CDN) -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Lucide React icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      // Expose lucide globally
      window.lucide = window.lucide || {};
    </script>

    <style>
      body {
        background-color: transparent !important;
        overflow: hidden;
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Hide scrollbars */
      ::-webkit-scrollbar {
        display: none;
      }

      /* Glassmorphism utilities */
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Particle background */
      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.08;
        animation: float-particle linear infinite;
      }

      @keyframes float-particle {
        0% { transform: translateY(0) translateX(0); opacity: 0.08; }
        50% { transform: translateY(-20px) translateX(10px); opacity: 0.12; }
        100% { transform: translateY(0) translateX(0); opacity: 0.08; }
      }

      .glow-pink {
        box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
      }
      .glow-blue {
        box-shadow: 0 0 30px rgba(0, 136, 204, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      const { useState, useEffect, useRef } = React;
      const { motion, AnimatePresence } = window.Motion || window.framerMotion || {};

      // ---- Icon components from lucide-react ----
      const InstagramIcon = ({ className }) =>
        React.createElement('svg', {
          xmlns: 'http://www.w3.org/2000/svg',
          width: 24,
          height: 24,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: 2,
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className: className,
        }, [
          React.createElement('rect', { width: 20, height: 20, x: 2, y: 2, rx: 5, ry: 5, key: 'r1' }),
          React.createElement('path', { d: 'M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z', key: 'p1' }),
          React.createElement('line', { x1: 17.5, y1: 17.5, x2: 19, y2: 19, key: 'l1' }),
        ]);

      const TelegramIcon = ({ className }) =>
        React.createElement('svg', {
          xmlns: 'http://www.w3.org/2000/svg',
          width: 24,
          height: 24,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: 2,
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className: className,
        }, [
          React.createElement('path', { d: 'M4.3 16.3l1.2-1.6m0 0l1.5-2m2 4L22 8m-3.5-1.5L4 16l2.7 1.2m4.8-7.6L12 7.8 4 16l5.1 1.3', key: 'p1' }),
        ]);

      // ---- Particle Background Component ----
      const ParticleBackground = ({ count = 25, area }) => {
        const particlesRef = useRef([]);

        useEffect(() => {
          const container = area.current;
          if (!container) return;

          const createParticle = () => {
            const el = document.createElement('div');
            el.className = 'particle';
            const size = Math.random() * 6 + 2;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            const colors = ['#ff69b4', '#c13584', '#0088cc', '#a78bfa'];
            el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            el.style.left = Math.random() * 100 + '%';
            el.style.top = Math.random() * 100 + '%';
            el.style.animationDuration = (Math.random() * 10 + 10) + 's';
            el.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(el);
            particlesRef.current.push(el);
            return el;
          };

          for (let i = 0; i < count; i++) createParticle();

          return () => {
            particlesRef.current.forEach(el => el.remove());
            particlesRef.current = [];
          };
        }, [count]);

        return React.createElement('div', { ref: area, className: 'absolute inset-0 overflow-hidden pointer-events-none' });
      };

      // ---- Social Card Component ----
      const SocialCard = ({ config, index }) => {
        if (!config.isEnabled) return null;

        const isInstagram = config.platform === 'instagram';
        const Icon = isInstagram ? InstagramIcon : TelegramIcon;

        const gradientStart = isInstagram ? '#f09433' : '#0088cc';
        const gradientEnd = isInstagram ? '#c13584' : '#06b6d4';
        const glowClass = isInstagram ? 'glow-pink' : 'glow-blue';
        const textClass = isInstagram ? 'text-pink-200' : 'text-blue-200';

        const cardVariants = {
          hidden: { opacity: 0, y: 20, scale: 0.95 },
          visible: { opacity: 1, y: 0, scale: 1 },
        };

        const iconVariants = {
          hidden: { opacity: 0, scale: 0.8 },
          visible: { opacity: 1, scale: 1 },
          hover: { scale: 1.1, rotate: 5 },
        };

        return React.createElement(
          motion.a,
          {
            href: config.link,
            target: '_blank',
            rel: 'noopener noreferrer',
            variants: cardVariants,
            initial: 'hidden',
            animate: 'visible',
            transition: { delay: index * 0.15, duration: 0.6, type: 'spring', stiffness: 100 },
            whileHover: { scale: 1.03, boxShadow: '0 0 35px rgba(192,132,252,0.7)' },
            className: `group relative block p-6 rounded-2xl shadow-xl transition-all duration-300 ease-out cursor-pointer border-2 overflow-hidden ${
              isInstagram
                ? 'bg-gradient-to-tr from-pink-500/15 to-purple-500/15 border-pink-300/40 text-white'
                : 'bg-gradient-to-tr from-blue-500/15 to-cyan-500/15 border-blue-300/40 text-white'
            } hover:border-pink-400/60 hover:border-blue-400/60`,
          },
          [
            // Ambient gradient glow behind card
            React.createElement('div', {
              key: 'bg-glow',
              className: 'absolute inset-0 opacity-20 pointer-events-none',
              style: {
                background: `radial-gradient(circle at 30% 30%, ${gradientStart}40, transparent 40%)`,
              },
            }),

            // Decorative corner element
            React.createElement('div', {
              key: 'corner',
              className: 'absolute top-0 right-0 w-8 h-8 rounded-bl-2xl opacity-30',
              style: { background: isInstagram ? gradientStart : gradientEnd },
            }),

            React.createElement('div', { key: 'content', className: 'relative z-10 flex items-center space-x-4' },
              React.createElement(
                motion.div,
                {
                  variants: iconVariants,
                  initial: 'hidden',
                  animate: 'visible',
                  whileHover: iconVariants.hover,
                  transition: { type: 'spring', stiffness: 300, damping: 30 },
                  className: `p-3 rounded-full shadow-lg ${isInstagram ? 'bg-pink-500/80' : 'bg-blue-500/80'} text-white`,
                },
                React.createElement(Icon, { className: 'w-6 h-6' })
              ),
              React.createElement('div', null,
                React.createElement('h3', {
                  className: 'text-lg font-semibold tracking-wide leading-tight',
                  style: { color: isInstagram ? gradientStart : gradientEnd },
                }, isInstagram ? 'Instagram' : 'Telegram'),
                React.createElement('p', {
                  className: 'text-sm font-medium text-white/90 mt-0.5',
                }, '@' + config.username)
              )
            ),

            // Animated underline glow on hover
            React.createElement('div', {
              key: 'underline',
              className: 'absolute bottom-0 left-1/2 w-0 h-0.5 -translate-x-1/2 transition-all duration-300 group-hover:w-full group-hover:left-0',
              style: { background: `linear-gradient(90deg, ${gradientStart}, ${gradientEnd})` },
            }),
          ]
        );
      };

      // ---- Widget Component ----
      const Widget = ({ config }) => {
        const areaRef = useRef(null);
        const [visible, setVisible] = useState(true);
        const timerRef = useRef(null);

        // Auto-hide logic
        useEffect(() => {
          if (!config.autoHide) return;

          const startCycle = () => {
            timerRef.current = setTimeout(() => {
              setVisible(false);
              setTimeout(() => {
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = setTimeout(() => setVisible(true), config.hideDuration);
              }, config.showDuration);
            }, config.autoHideDelay);
          };

          startCycle();

          return () => {
            if (timerRef.current) clearTimeout(timerRef.current);
          };
        }, [config.autoHide, config.autoHideDelay, config.showDuration, config.hideDuration]);

        const socialList = [
          { config: config.instagram, index: 0 },
          { config: config.telegram, index: 1 },
        ];

        // Mode-based layout classes
        const layoutClasses = {
          horizontal: 'flex flex-col items-center justify-center gap-4',
          vertical: 'flex flex-col items-start justify-center gap-4',
          compact: 'flex flex-row items-center justify-center gap-3',
        }[config.mode];

        const containerClasses = `w-full max-w-xl p-6 relative z-10 ${layoutClasses}`;

        // Theme-based background tints
        const themeBg = {
          pink: 'bg-[radial-gradient(circle_at_center,_rgba(255,105,180,0.15)_0%,_transparent_70%)]',
          lavender: 'bg-[radial-gradient(circle_at_center,_rgba(192,132,252,0.15)_0%,_transparent_70%)]',
          default: 'bg-transparent',
        }[config.theme];

        return React.createElement(
          'div',
          {
            className: 'flex items-center justify-center min-h-screen w-full bg-transparent p-4 overflow-hidden',
            style: { backgroundColor: 'transparent' },
          },
          [
            React.createElement(ParticleBackground, { key: 'particles', count: 25, area: areaRef }),
            React.createElement('div', { ref: areaRef, className: 'absolute inset-0 pointer-events-none' }),

            React.createElement(
              AnimatePresence,
              { key: 'widget-preset', initial: false },
              visible
                ? React.createElement(
                    motion.div,
                    {
                      initial: { opacity: 0, y: 10, scale: 0.98 },
                      animate: { opacity: 1, y: 0, scale: 1 },
                      exit: { opacity: 0, y: -10, scale: 0.98 },
                      transition: { duration: 0.5, ease: 'easeOut' },
                      className: `${containerClasses} ${themeBg}`,
                    },
                    [
                      config.title &&
                      React.createElement('h2', {
                        key: 'title',
                        className: 'text-2xl font-extrabold text-white tracking-wider text-center mb-6 select-none',
                        style: { letterSpacing: '-0.02em' },
                      }, config.title),
                      React.createElement('div', { key: 'cards', className: 'w-full flex flex-col gap-4' },
                        socialList.map((item) =>
                          React.createElement(SocialCard, { key: item.config.platform, config: item.config, index: item.index })
                        )
                      ),
                    ]
                  )
                : null
            ),
          ]
        );
      };

      // ---- Default Config ----
      const initialConfig = {
        title: 'Social Media',
        mode: 'horizontal',
        autoHide: false,
        autoHideDelay: 15000,
        showDuration: 10000,
        hideDuration: 1000,
        theme: 'pink',
        animationSpeed: 500,
        glowIntensity: 0.6,
        showBackgroundParticles: true,
        instagram: {
          platform: 'instagram',
          username: 'elya_asmadulova',
          link: 'https://www.instagram.com/elya_asmadulova/',
          isEnabled: true,
        },
        telegram: {
          platform: 'telegram',
          username: 'vanesso44ka',
          link: 'https://t.me/vanesso44ka',
          isEnabled: true,
        },
      };

      // ---- App ----
      const App = () => {
        const [config, setConfig] = useState(initialConfig);
        return React.createElement(Widget, { config });
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
